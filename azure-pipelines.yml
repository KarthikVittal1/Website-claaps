trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'claapswebsite-rm-connection'
  webAppName: 'claapswebsite'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'

- script: |
    npm ci --omit=dev
    npm run build
  displayName: 'Build Next.js App'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '.'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
    replaceExistingArchive: true
    excludePatterns: |
      node_modules/**
      .git/**
      .next/cache/**

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'claapswebsite-rm-connection'
    appType: 'webAppLinux'
    appName: 'claapswebsite'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'
    appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT true -NODE_ENV production'
    startUpCommand: 'npm start'