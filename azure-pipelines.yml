trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'claapswebsite-rm-connection'
  webAppName: 'claapswebsite'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'

- script: |
    npm install
    npm run build
    cp -r .next/static .next/standalone/.next/static
    cp -r public .next/standalone/public
  displayName: 'Build Next.js App'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '.next/standalone'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'claapswebsite-rm-connection'
    appType: 'webAppLinux'
    appName: 'claapswebsite'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'
    appSettings: '-SCM_DO_BUILD_DURING_DEPLOYMENT false -NODE_ENV production -PORT 8080'
    startUpCommand: 'node server.js'