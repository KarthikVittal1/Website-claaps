trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureSubscription: 'claapswebsite-rm-connection'
  webAppName: 'claapswebsite'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '22.x'

- script: |
    npm install
    npm run build
  displayName: 'Build Next.js App'

- script: |
    mkdir -p deploy
    cp -r .next deploy/
    cp -r public deploy/
    cp package.json deploy/
    cp package-lock.json deploy/
    cp next.config.ts deploy/
    cd deploy && npm install --omit=dev
  displayName: 'Prepare deploy folder'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'deploy'
    includeRootFolder: false
    archiveType: zip
    archiveFile: '$(Build.ArtifactStagingDirectory)/site.zip'
    replaceExistingArchive: true

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'claapswebsite-rm-connection'
    appType: 'webAppLinux'
    appName: 'claapswebsite'
    package: '$(Build.ArtifactStagingDirectory)/site.zip'